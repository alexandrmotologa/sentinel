# Sentinel Monitoring Configuration Example
global:
  default_interval: 60s            # Default check interval (e.g., 30s, 1m, 5m)
  default_timeout: 10s             # Default request timeout
  consecutive_failures_to_alert: 2 # Debounce: alert triggered after 2 consecutive failures
  daily_summary_time: "09:00"      # Optional daily summary notification time in UTC
  db_path: "sentinel.db"           # SQLite database for persistent incident history & SLA

metrics:
  enabled: true                    # Embedded async metrics server
  host: "0.0.0.0"                  # Listen address
  port: 9090                       # Serves /metrics (Prometheus), /healthz (JSON), and /status (Web UI)

status_page:
  title: "Acme Infrastructure Status"
  company_name: "Acme Corporation"
  logo_url: ""                     # URL or data URI for custom SVG/PNG logo
  announcement: ""                 # Optional system-wide announcement banner
  announcement_type: "info"        # Visual type: 'info', 'warning', or 'outage'

maintenance:
  - name: "database-backup"
    targets: ["Primary PostgreSQL"]
    schedule: "daily 02:00-03:00 UTC"
    reason: "Nightly automated snapshot and vacuum"

  - name: "weekly-reboot"
    targets: ["*"]
    schedule: "weekly sun 01:00-02:00 UTC"
    reason: "Scheduled cluster maintenance"

telegram:
  bot_token: "env:TELEGRAM_BOT_TOKEN" # Resolves environment variable
  chat_id: "env:TELEGRAM_CHAT_ID"     # Destination chat or channel ID
  send_silently: false                # When true, delivers recovery alerts without sound
  enabled: true

webhook:
  url: "env:WEBHOOK_URL"              # Generic JSON webhook endpoint
  headers:
    X-Sentinel-Auth: "env:WEBHOOK_SECRET"
  enabled: false

discord:
  webhook_url: "env:DISCORD_WEBHOOK_URL" # Native Discord webhook with rich embeds
  username: "Sentinel"
  avatar_url: ""
  enabled: false

slack:
  webhook_url: "env:SLACK_WEBHOOK_URL"   # Native Slack incoming webhook with Block Kit
  enabled: false

targets:
  - name: "Production API Health"
    url: "https://api.example.com/health"
    interval: 30s
    timeout: 5s
    method: "GET"
    notify: ["telegram", "slack"]        # Per-target alert channel routing
    severity: "critical"                 # Alert severity tier ('critical', 'warning', 'info')
    headers:
      Authorization: "Bearer env:API_SECRET"
    expect:
      status_code: 200
      max_latency_ms: 1500
      json:
        status: "ok"
        database: "connected"

  - name: "Landing Page"
    url: "https://example.com"
    interval: 60s
    notify: ["telegram"]
    severity: "warning"
    expect:
      status_code: 200
      contains_text: "Example Domain"
      ssl_check: true
      ssl_warn_days: 14

  - name: "Stripe Webhook Listener"
    url: "https://hooks.example.com/ping"
    interval: 45s
    method: "POST"
    headers:
      Content-Type: "application/json"
    body: '{"test": true}'
    expect:
      status_code: [200, 201, 204]

tcp_targets:
  - name: "Primary PostgreSQL"
    host: "db.internal.example.com"
    port: 5432
    interval: 30s
    timeout: 3s
    notify: ["slack"]
    severity: "critical"

  - name: "Redis Cache Cluster"
    host: "127.0.0.1"
    port: 6379
    interval: 15s
    timeout: 2s

dns_targets:
  - name: "Cloudflare DNS Resolution"
    host: "one.one.one.one"
    record_type: "A"
    interval: 60s
    timeout: 5s
    expect:
      expected_ips:
        - "1.1.1.1"
      max_latency_ms: 500

  - name: "Public Gateway Resolver"
    host: "dns.google"
    record_type: "A"
    interval: 60s
    timeout: 5s
    expect:
      expected_ips:
        - "8.8.8.8"

ping_targets:
  - name: "Edge Gateway Router"
    host: "1.1.1.1"
    count: 3
    interval: 30s
    timeout: 2s
    expect:
      max_latency_ms: 50
      max_packet_loss_percent: 0
    notify: ["telegram"]
    severity: "warning"

  - name: "Google Public Anycast"
    host: "8.8.8.8"
    count: 4
    interval: 60s
    timeout: 3s
    expect:
      max_latency_ms: 100
      max_packet_loss_percent: 0
